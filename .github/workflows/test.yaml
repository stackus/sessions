name: Test

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
  workflow_dispatch:

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # go.mod requires 1.26.8 (github.com/stackus/errors v0.2.0).
          go-version-file: go.mod
          cache: true
      - name: Run Tests
        run: go test -race -cover -coverprofile=coverage -covermode=atomic -v ./...
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage
          format: golang
